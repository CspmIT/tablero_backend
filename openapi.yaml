      summary: Eliminar archivo (de la base y de MinIO)
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'
  /grilla:
    get:
      tags:
      - grilla
      summary: Entradas de grilla por rango/colaborador
      parameters:
      - name: colaboradorId
        in: query
        schema: *id002
      - name: desde
        in: query
        schema: &id003
          type: string
          format: date
      - name: hasta
        in: query
        schema: *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrillaEntrada'
    put:
      tags:
      - grilla
      summary: Crear o actualizar la entrada de un día (upsert por colaborador+fecha)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrillaEntradaInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrillaEntrada'
  /costos:
    get:
      tags:
      - costos
      summary: Listar costos por mes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostoMensual'
  /costos/{mes}:
    parameters:
    - name: mes
      in: path
      required: true
      schema:
        type: string
        example: 2026-06
    get:
      tags:
      - costos
      summary: Costos de un mes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostoMensual'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - costos
      summary: Cargar/actualizar costos del mes (rol gerencial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostoMensualInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostoMensual'
