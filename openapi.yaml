      tags:
      - archivos
      summary: Subir archivo a MinIO
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                leadId: &id002
                  type: integer
                contexto: &id004
                  type: string
                gpsLat: &id001
                  type: number
                gpsLng: *id001
                esBoceto: &id005
                  type: boolean
